name: Android14 API34 x86_64 SukiSU Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  KERNEL_DEFCONFIG: gki_defconfig
  KERNEL_REPOSITORY: https://android.googlesource.com/kernel/common
  KERNEL_BRANCH: android14-6.1
  VIRTUAL_DEVICE_REPOSITORY: https://android.googlesource.com/kernel/common-modules/virtual-device
  VIRTUAL_DEVICE_BRANCH: android14-6.1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: sukisu

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            dwarves pahole \
            rsync cpio

      - name: Integrate SukiSU Ultra
        run: |
          git clone --depth=1 --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPOSITORY" kernel-source
          mkdir -p kernel-source/common-modules
          git clone --depth=1 --branch "$VIRTUAL_DEVICE_BRANCH" \
            "$VIRTUAL_DEVICE_REPOSITORY" kernel-source/common-modules/virtual-device
          cd kernel-source
          bash ../sukisu/kernel/setup.sh main

      - name: Configure Kernel
        run: |
          cd kernel-source
          make "$KERNEL_DEFCONFIG"
          scripts/kconfig/merge_config.sh -m -r .config \
            common-modules/virtual-device/virtual_device_core.fragment \
            common-modules/virtual-device/virtual_device.fragment
          make olddefconfig

      - name: Build Kernel
        run: |
          cd kernel-source
          make -j$(nproc)

      - name: Prepare Release Files
        run: |
          cd kernel-source
          mkdir release
          cp arch/x86/boot/bzImage release/
          sha256sum release/bzImage > release/bzImage.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-release
          path: kernel-source/release/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-release
          path: release

      - name: Generate Version
        id: version
        run: |
          echo "TAG=a14-api34-6.1-sukisu-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "${{ steps.version.outputs.TAG }}" \
            release/* \
            --title "${{ steps.version.outputs.TAG }}" \
            --generate-notes
