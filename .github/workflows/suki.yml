name: Android14 API34 x86_64 SukiSU Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  AVD_BUILD_ID: '9964412'
  AVD_MANIFEST_ARCH: kernel_virt_x86_64
  KERNEL_MANIFEST_BRANCH: common-android14-6.1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: sukisu

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            repo curl \
            git bc bison flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            dwarves pahole \
            rsync cpio

      - name: Integrate SukiSU Ultra
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          mkdir kernel-source
          cd kernel-source
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "$KERNEL_MANIFEST_BRANCH" \
            --depth=1
          curl -fL \
            "https://ci.android.com/builds/submitted/${AVD_BUILD_ID}/${AVD_MANIFEST_ARCH}/latest/raw/manifest_${AVD_BUILD_ID}.xml" \
            -o ".repo/manifests/manifest_${AVD_BUILD_ID}.xml"
          repo init -m "manifest_${AVD_BUILD_ID}.xml"
          repo sync -c -j"$(nproc)"

          bash ../sukisu/kernel/setup.sh main
          rm -rf common/drivers/kernelsu
          cp -a KernelSU/kernel common/drivers/kernelsu
          if [ -d KernelSU/uapi ] && [ -L common/drivers/kernelsu/include/uapi ]; then
            rm -f common/drivers/kernelsu/include/uapi
            cp -a KernelSU/uapi common/drivers/kernelsu/include/uapi
          fi

          # Android 14's 6.1 GKI uses the syscall-table path and does not
          # provide X86_FEATURE_INDIRECT_SAFE.
          INIT_FILE=common/drivers/kernelsu/core/init.c
          python3 - "$INIT_FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          source = open(path, encoding="utf-8").read()
          source = re.sub(
              r"\n#ifndef X86_FEATURE_INDIRECT_SAFE.*?#endif\n",
              "\n",
              source,
              count=1,
              flags=re.DOTALL,
          )
          source = re.sub(
              r"\n#if defined\(__x86_64__\) && !defined\(CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER\)\n[ \t]*// If the kernel has the hardening patch,.*?\n#endif\n",
              "\n",
              source,
              count=1,
              flags=re.DOTALL,
          )
          open(path, "w", encoding="utf-8").write(source)
          PY
          if grep -q 'X86_FEATURE_INDIRECT_SAFE' "$INIT_FILE"; then
            echo "Unsupported x86 syscall hardening check remains in SukiSU."
            exit 1
          fi

      - name: Build Kernel
        run: |
          cd kernel-source
          help_output=$(tools/bazel run --config=fast --lto=none \
            //common:kernel_x86_64_dist -- -h 2>&1 || true)
          if grep -q -- '--destdir' <<< "$help_output"; then
            DIST_ARG=--destdir
          elif grep -q -- '--dist_dir' <<< "$help_output"; then
            DIST_ARG=--dist_dir
          else
            echo "$help_output"
            echo "Unable to determine the Bazel dist output argument."
            exit 1
          fi
          tools/bazel run --config=fast --lto=none \
            //common:kernel_x86_64_dist -- "${DIST_ARG}=dist"

      - name: Prepare Release Files
        run: |
          cd kernel-source
          mkdir -p release
          cp "$(find dist -type f -name bzImage -print -quit)" release/bzImage
          sha256sum release/bzImage > release/bzImage.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-release
          path: kernel-source/release/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-release
          path: release

      - name: Generate Version
        id: version
        run: |
          echo "TAG=a14-api34-6.1-sukisu-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "${{ steps.version.outputs.TAG }}" \
            release/* \
            --title "${{ steps.version.outputs.TAG }}" \
            --generate-notes
